  <style>
    :root { color-scheme: light; --green:#166534; --blue:#2563eb; --red:#dc2626; }
    * { box-sizing:border-box; font-family:Arial,sans-serif; }
    body { margin:0; background:#f3f6f4; color:#17211b; }
    .wrap { max-width:1000px; margin:auto; padding:16px; }

    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .stat { background:#f0fdf4; border:1px solid #dcfce7; border-radius:12px; padding:14px; }
    .stat strong { display:block; font-size:20px; margin-top:6px; overflow-wrap:anywhere; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:650px; }
    th,td { padding:11px 9px; border-bottom:1px solid #e5e7eb; text-align:left; font-size:14px; }
    th { background:#f8fafc; }
    .small-btn { padding:8px 10px; margin:2px; font-size:13px; }
    #app { display:none; } #message { margin-top:12px; color:#b91c1c; overflow-wrap:anywhere; }
    .positive { color:#166534; } .negative { color:#b91c1c; }
